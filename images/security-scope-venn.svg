<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans Thai','Segoe UI',sans-serif">
  <rect x="0" y="0" width="640" height="560" fill="#ffffff"/>

  <text x="320" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">ขอบเขตสามคำที่ใช้สลับกันได้ — แต่ไม่เท่ากัน</text>

  <!-- outer circle: Information Security (largest, contains the other two) -->
  <circle cx="320" cy="290" r="215" fill="none" stroke="#1e3a8a" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="320" y="90" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Information Security</text>

  <!-- two overlapping circles inside: Computer Security + Cybersecurity -->
  <circle cx="255" cy="300" r="135" fill="#0f766e" fill-opacity="0.55"/>
  <circle cx="390" cy="300" r="135" fill="#b45309" fill-opacity="0.55"/>

  <text x="205" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Computer</text>
  <text x="205" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Security</text>

  <text x="440" y="240" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Cyber-</text>
  <text x="440" y="260" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">security</text>

  <text x="320" y="305" text-anchor="middle" font-size="12" fill="#ffffff">ทับซ้อนกันมาก</text>

  <!-- caption box -->
  <rect x="50" y="470" width="540" height="75" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="320" y="492" text-anchor="middle" font-size="13" fill="#111827">Information Security กว้างสุด — รวมข้อมูลทุกรูปแบบ ไม่จำกัดแค่ระบบดิจิทัล</text>
  <text x="320" y="510" text-anchor="middle" font-size="13" fill="#111827">Computer Security เน้นระบบคอมพิวเตอร์อัตโนมัติ · Cybersecurity เน้น cyberspace + การตอบสนอง/ฟื้นฟู</text>
  <text x="320" y="528" text-anchor="middle" font-size="12" fill="#6b7280">พ.ร.บ.ไซเบอร์ 2562 ของไทย จำกัด "cybersecurity" ไว้แค่โครงสร้างพื้นฐานสำคัญของรัฐ — แคบกว่ารูปนี้</text>
</svg>
