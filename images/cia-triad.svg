<svg viewBox="0 0 640 560" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans Thai','Segoe UI',sans-serif">
  <rect x="0" y="0" width="640" height="560" fill="#ffffff"/>

  <text x="320" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">CIA Triad — สามเป้าหมายหลักของ Protection</text>

  <!-- triangle: top = Confidentiality, bottom-left = Integrity, bottom-right = Availability -->
  <polygon points="320,90 130,430 510,430" fill="none" stroke="#1e3a8a" stroke-width="4"/>

  <!-- Confidentiality (top) -->
  <circle cx="320" cy="90" r="46" fill="#1e3a8a"/>
  <text x="320" y="85" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Confidentiality</text>
  <text x="320" y="103" text-anchor="middle" font-size="11" fill="#dbeafe">ใครควรเห็น</text>

  <!-- Integrity (bottom left) -->
  <circle cx="130" cy="430" r="46" fill="#0f766e"/>
  <text x="130" y="425" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Integrity</text>
  <text x="130" y="443" text-anchor="middle" font-size="11" fill="#ccfbf1">ใครควรแก้</text>

  <!-- Availability (bottom right) -->
  <circle cx="510" cy="430" r="46" fill="#b45309"/>
  <text x="510" y="425" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Availability</text>
  <text x="510" y="443" text-anchor="middle" font-size="11" fill="#fef3c7">ใครควรใช้ได้เมื่อไร</text>

  <!-- side labels: key questions along each edge -->
  <text x="185" y="240" font-size="12" fill="#374151" transform="rotate(-61 185 240)">รั่ว = เสีย confidentiality</text>
  <text x="440" y="240" font-size="12" fill="#374151" transform="rotate(61 440 240)">แก้ผิด = เสีย integrity</text>
  <text x="320" y="465" text-anchor="middle" font-size="12" fill="#374151">ล่ม/เข้าไม่ได้ = เสีย availability</text>

  <!-- caption box -->
  <rect x="60" y="480" width="520" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="320" y="502" text-anchor="middle" font-size="13" fill="#111827">นิยามทางการ (NIST SP 800-12 Rev.1): preserve confidentiality, integrity, availability</text>
  <text x="320" y="522" text-anchor="middle" font-size="13" fill="#111827">FIPS 199: จัดระดับผลกระทบแยกแต่ละมุม แล้วใช้ high-water mark สรุปทั้งระบบ</text>
</svg>
